<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Opens without Safari's bars when added to the home screen, like the real app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dictation test">
<title>Dictation test</title>
<style>
  :root { --ground: #ebeae5; --surface: #fff; --ink: #17191c; --ink-3: #5f636b; --off: #b23a2a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --ground: #121110; --surface: #262421; --ink: #ece8e2; --ink-3: #938c83; --off: #e2826f; color-scheme: dark; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 17px/1.4 system-ui, sans-serif; padding: calc(env(safe-area-inset-top) + 24px) 16px 32px; max-width: 430px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 22px; }
  p { color: var(--ink-3); font-size: 15px; }
  #mode, #support { font-weight: 700; color: var(--ink); }
  button { font: inherit; font-weight: 700; font-size: 19px; border: 0; border-radius: 16px; min-height: 96px; background: #17191c; color: #f2f2ef; }
  button[aria-pressed="true"] { background: var(--off); }
  #words { min-height: 120px; padding: 14px; border-radius: 14px; background: var(--surface); font-size: 19px; }
  #log { font: 13px/1.5 ui-monospace, monospace; color: var(--ink-3); white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Dictation test</h1>
  <p>Running as: <span id="mode"></span></p>
  <p>Speech recognition: <span id="support"></span></p>
  <button id="go" aria-pressed="false">Tap and talk</button>
  <div id="words" aria-live="polite"></div>
  <p>Report back: did the words appear while you talked, from the home-screen icon and in Safari?</p>
  <div id="log"></div>
<script>
  const $ = id => document.getElementById(id);
  const log = msg => { $('log').textContent += new Date().toLocaleTimeString() + '  ' + msg + '\n'; };
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  $('mode').textContent = standalone ? 'Home-screen app' : 'Safari tab';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('support').textContent = SR ? 'available' : 'not available';
  let rec = null;
  $('go').onclick = () => {
    if (!SR) { log('No SpeechRecognition API here.'); return; }
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = true;
    rec.continuous = false;
    rec.onstart = () => { $('go').textContent = 'Listening. Tap to stop'; $('go').setAttribute('aria-pressed', 'true'); log('started'); };
    rec.onresult = e => { $('words').textContent = Array.from(e.results).map(r => r[0].transcript).join(''); };
    rec.onerror = e => log('error: ' + e.error + (e.message ? ' (' + e.message + ')' : ''));
    rec.onend = () => { $('go').textContent = 'Tap and talk'; $('go').setAttribute('aria-pressed', 'false'); log('ended'); rec = null; };
    try { rec.start(); } catch (err) { log('start threw: ' + err.message); rec = null; }
  };
</script>
</body>
</html>
